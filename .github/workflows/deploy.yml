name: Deploy OSINT Email Lookup
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: |
          cd behind-the-email
          npm ci
      - name: Verify build
        run: |
          cd behind-the-email
          node -c server.js && node -c src/osintEngine.js
          echo "Build OK"

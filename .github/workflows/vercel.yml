name: Deploy to Vercel
on:
  push:
    branches: [main, feature/osint-clone]
  pull_request:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: behind-the-email
        run: npm install
      - name: Skip deploy when Vercel secrets are missing
        if: ${{ secrets.VERCEL_TOKEN == '' || secrets.ORG_ID == '' || secrets.PROJECT_ID == '' }}
        run: echo "Skipping Vercel deploy because one or more required secrets are not configured."
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.ORG_ID != '' && secrets.PROJECT_ID != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          working-directory: behind-the-email
          scope: ${{ secrets.VERCEL_ORG_ID }}
